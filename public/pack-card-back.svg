<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 350" width="250" height="350" role="img" aria-label="카드 뒷면">
  <!-- 카드 뽑기 전용 뒷면. 세트 화면의 '이미지 준비 중' 자리표시(card-back.svg)와는 다른 파일이다.
       쇼케이스 진열장과 같은 톤(어두운 남색 + 금색 포인트)의 자체 디자인. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.5" stop-color="#2e2a6e"/>
      <stop offset="1" stop-color="#171532"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.65">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0H18" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
      <path d="M0 9H18" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="250" height="350" rx="14" fill="url(#bg)"/>
  <rect width="250" height="350" rx="14" fill="url(#grid)"/>
  <rect width="250" height="350" rx="14" fill="url(#glow)"/>

  <!-- 이중 테두리 -->
  <rect x="9" y="9" width="232" height="332" rx="10" fill="none" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.6"/>
  <rect x="15" y="15" width="220" height="320" rx="7" fill="none" stroke="#fbbf24" stroke-opacity="0.16" stroke-width="1"/>

  <!-- 중앙 문양: 겹친 다이아(레어 카드 모티프) -->
  <g transform="translate(125,158)">
    <rect x="-52" y="-52" width="104" height="104" transform="rotate(45)" fill="none" stroke="#fbbf24" stroke-opacity="0.75" stroke-width="2.4"/>
    <rect x="-38" y="-38" width="76" height="76" transform="rotate(45)" fill="none" stroke="#fbbf24" stroke-opacity="0.32" stroke-width="1.4"/>
    <rect x="-24" y="-24" width="48" height="48" transform="rotate(45)" fill="none" stroke="#fbbf24" stroke-opacity="0.18" stroke-width="1"/>
    <rect x="-7" y="-7" width="14" height="14" transform="rotate(45)" fill="#fbbf24" fill-opacity="0.9"/>
    <!-- 모서리 빛점 -->
    <circle cx="0" cy="-74" r="2.4" fill="#fbbf24" fill-opacity="0.8"/>
    <circle cx="0" cy="74" r="2.4" fill="#fbbf24" fill-opacity="0.8"/>
    <circle cx="-74" cy="0" r="2.4" fill="#fbbf24" fill-opacity="0.8"/>
    <circle cx="74" cy="0" r="2.4" fill="#fbbf24" fill-opacity="0.8"/>
  </g>

  <text x="125" y="292" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="6" fill="#fbbf24" fill-opacity="0.85">pokegre</text>
  <text x="125" y="312" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" letter-spacing="3" fill="#c7c3f5" fill-opacity="0.55">CARD PACK</text>
</svg>
