<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 350" width="250" height="350" role="img" aria-label="카드 뒷면">
  <!-- 팩 개봉의 "아직 안 뒤집은 카드". 실제 카드 뒷면을 흉내 내지 않되(가짜 카드 거부감),
       흰 화면에서 또렷이 보이도록 사이트의 검정 버튼 톤(진회색)으로 만든 자리 표시다.
       가운데는 pokegre 로고(favicon.svg와 같은 번개), 그 아래 워드마크를 놓는다. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d2d2d"/>
      <stop offset="1" stop-color="#171717"/>
    </linearGradient>
  </defs>

  <rect width="250" height="350" rx="14" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="247" height="347" rx="12.5" fill="none" stroke="#444444" stroke-width="2"/>
  <rect x="13" y="13" width="224" height="324" rx="8" fill="none" stroke="#3a3a3a" stroke-width="1.5"/>

  <!-- 로고: 가는 선 다이아 안에 번개 -->
  <g transform="translate(125,150)">
    <rect x="-46" y="-46" width="92" height="92" rx="7" transform="rotate(45)" fill="none" stroke="#5c5c5c" stroke-width="1.6"/>
    <rect x="-38" y="-38" width="76" height="76" rx="6" transform="rotate(45)" fill="#232323" stroke="#3d3d3d" stroke-width="1"/>
    <g transform="translate(-30.2,-28.1) scale(1.25)" fill="#e8e8e8">
      <path d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.946 44.938z"/>
    </g>
  </g>

  <!-- 워드마크: 로고 아래 -->
  <text x="125" y="263" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="4.5" fill="#c9c9c9">pokegre</text>
  <line x1="90" y1="279" x2="160" y2="279" stroke="#3f3f3f" stroke-width="1.2"/>
</svg>
