# 앱 이름은 fly launch 때 정해지며 전역에서 유일해야 한다. 이미 쓰는 이름이면
# fly가 다른 이름을 제안한다. 바뀌면 아래 PUBLIC_ORIGIN도 같이 바꿔야 한다.
app = "pokegre"

# 도쿄. 사용자와 가까운 것도 있지만, 더 중요한 건 SNKRDUNK가 일본에 있다는 점이다.
# 서버→업스트림이 같은 나라 안이라 카드 조회가 빨라진다. 싱가포르·미국을 고르면
# 사용자→서버와 서버→SNKRDUNK 두 홉이 모두 멀어진다.
primary_region = "nrt"

[build]

[env]
  PORT = "3000"
  # 볼륨 마운트 지점. server/api.ts가 이 경로에 사용자·세션·게시글 JSON을 쓴다.
  POKEGRE_DATA_DIR = "/data"
  # 카카오에 넘길 redirect_uri의 기준. 앱 이름이나 도메인이 바뀌면 여기도 바꾸고
  # 카카오 개발자 콘솔에도 같은 주소를 등록해야 한다.
  PUBLIC_ORIGIN = "https://pokegre.com"

[http_service]
  internal_port = 3000
  force_https = true
  # 재우지 않는다. 재웠다가 깨우는 데 실제로 재보니 7.9초가 걸렸다(깨어 있으면 0.23초).
  # 처음 온 사람은 그 8초를 기다리다 고장난 줄 알고 나가버린다. 아껴지는 돈이 월 3달러
  # 남짓이라 그걸 감수할 이유가 없다.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # 건강 검사. 이게 없으면 Fly는 "포트가 열려 있는가"만 본다 — 서버가 떠 있지만 아무것도
  # 못 하는 상태(볼륨이 안 붙었다든가)를 정상으로 보고 그대로 둔다. 배포한 새 버전이
  # 고장났을 때도 이 검사가 있어야 배포가 실패로 끝나고 옛 버전이 살아남는다.
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

# 데이터가 JSON 파일이라 볼륨이 없으면 배포할 때마다 회원과 게시글이 전부 사라진다.
# 머신 한 대에 붙는 로컬 디스크라, 나중에 여러 대로 늘리려면 그때 DB로 옮겨야 한다.
[mounts]
  source = "pokegre_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  # ⚠️ 2026-08-23에 512mb → 1gb. 서버가 켜지자마자 305MB를 쓰는데(팝수·인쇄판 시세·
  #    등급값·낙찰을 다 메모리에 인다) 기계가 459MB라 여유가 100MB뿐이었다. 6시간마다
  #    도는 청소 둘이 겹친 순간 넘쳐서 낮 12시에 한 번 죽고(OOM), 18시에 멈춰
  #    **2시간 12분 먹통**이었다. 월 $3.32 → $5.92(+$2.60). 사장님 승인.
  memory = "1gb"
