<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111111" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>포켓몬 카드 시세 | pokegre — 포켓몬 카드의 모든 것</title>
    <!-- ⚠️ **「한글판 시세」라고 적지 마라.** 2026-08-10에 이베이 한글판을 뺐고 판은
         일본판·북미판 둘뿐이다. 여기 적힌 말이 그대로 구글·네이버 검색결과에 나가므로,
         없는 기능을 적어 두면 그걸 보고 들어온 사람이 빈손으로 나간다. -->
    <meta
      name="description"
      content="포켓몬 카드의 모든 것. 일본판·북미판 시세를 한국어로 보고, 카드 뽑기·센터링 측정·세트별·작가별 목록까지 씁니다."
    />
    <meta name="robots" content="index, follow" />

    <!-- 애드센스 (2026-08-21 심사 신청). 심사 통과 전에는 광고가 안 나온다 — 이 코드는
         소유 확인·심사용이고, 실제 게재는 src/lib/ads.ts의 슬롯 번호를 채워야 시작된다.
         ⚠️ ads.ts의 광고스크립트달기()는 이 태그가 이미 있으면 다시 안 단다(중복 방지). -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6821820286219469"
      crossorigin="anonymous"
    ></script>
    <meta name="google-adsense-account" content="ca-pub-6821820286219469" />
    <link rel="canonical" href="https://pokegre.com/" />

    <!-- 네이버 서치어드바이저 사이트 소유확인 -->
    <meta name="naver-site-verification" content="c8c8dd7600679daf31091fed2d29c440ea06ef45" />

    <!-- 카톡·커뮤니티에 링크를 붙였을 때 뜨는 미리보기(제목·설명·이미지). 이게 있어야
         링크가 '진짜 사이트'처럼 보여서 클릭률이 오른다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="pokegre" />
    <meta property="og:title" content="pokegre — 포켓몬 카드의 모든 것" />
    <meta
      property="og:description"
      content="일본판·북미판 포켓몬 카드 시세를 한국어로 봅니다. 카드 뽑기·센터링 측정·세트별 목록까지."
    />
    <meta property="og:url" content="https://pokegre.com/" />
    <meta property="og:image" content="https://pokegre.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="pokegre — 포켓몬 카드의 모든 것" />
    <meta
      name="twitter:description"
      content="일본판·북미판 포켓몬 카드 시세를 한국어로 봅니다. 카드 뽑기·센터링 측정·세트별 목록까지."
    />
    <meta name="twitter:image" content="https://pokegre.com/og.jpg" />
    <!-- ⚠️⚠️ **첫 그림보다 먼저 발라야 한다.** 리액트가 뜬 뒤에 바르면 밝은 화면이 한 번
         번쩍하고 어두워진다(FOUC). 그래서 여기서 한 번 바르고, 그 뒤는 src/lib/theme.ts가
         맡는다. **열쇠 이름·값을 두 곳이 같게 둘 것.** -->
    <script>
      try {
        var t = localStorage.getItem('pokegre_theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
